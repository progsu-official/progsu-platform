name: Progsu
options:
  bundleIdPrefix: com.progsu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.5"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3
targets:
  Progsu:
    type: application
    platform: iOS
    sources:
      - path: Progsu
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Progsu/Resources/Progsu.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PROGSU_BUNDLE_ID)
        INFOPLIST_FILE: Progsu/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  ProgsuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProgsuTests
    dependencies:
      - target: Progsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.progsu.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Progsu.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Progsu
        BUNDLE_LOADER: $(TEST_HOST)
  ProgsuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ProgsuUITests
    dependencies:
      - target: Progsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.progsu.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Progsu
schemes:
  Progsu:
    build:
      targets:
        Progsu: all
        ProgsuTests: [test]
        ProgsuUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ProgsuTests
        - ProgsuUITests
    archive:
      config: Release
