name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write build-only env stubs
        # Next.js build evaluates `lib/env.ts` at compile time; we stub just enough
        # to let typecheck + build pass without a live Supabase.
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-stub-anon
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY=ci-stub-service
          SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          EOF

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
